services:
  webuntis-calendar-sync:
    image: ghcr.io/racoon80/webuntis-calendar-sync:latest
    # build: .
    container_name: webuntis-calendar-sync
    restart: unless-stopped
    env_file: .env              # all logins and secrets, see .env.example
    environment:
      WEBUNTIS_SERVER: myschool.webuntis.com
      WEBUNTIS_SCHOOL: myschool
      TARGETS: nextcloud        # any of: nextcloud, caldav, google (comma-separated)
      NEXTCLOUD_URL: https://cloud.example.com
      # CALDAV_URL: https://caldav.example.com/
      LANGUAGE_TITLES: lb       # lb, de, fr or en
      SYNC_INTERVAL: 3600       # seconds
      TZ: Europe/Luxembourg
    volumes:
      - ./data:/data
