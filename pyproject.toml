[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webuntis-calendar-sync"
version = "0.2.1"
description = "WebUntis timetable, exams and homework into Nextcloud, any CalDAV server or Google Calendar / Tasks"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "defusedxml>=0.7", "tzdata"]

[project.scripts]
webuntis-calendar-sync = "webuntis_calendar_sync.__main__:main"

[project.optional-dependencies]
test = ["pytest", "radicale"]
